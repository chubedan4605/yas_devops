name: Sample Service Build on K8s Runner

on:
  push:
    branches:
      - '**'

jobs:
  build-on-k8s:
    runs-on: arc-runner-set
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Kubernetes Runner Environment
        run: |
          echo "=========================================================="
          echo "🚀 JOB DANG CHAY TRUC TIEP TREN KUBERNETES RUNNER POD!"
          echo "=========================================================="
          echo "📌 Hostname (Ten Pod): $(hostname)"
          echo "📌 He dieu hanh: $(cat /etc/os-release | grep PRETTY_NAME)"
          echo "📌 So nhan CPU cap cho Pod: $(nproc)"
          echo "📌 Bo nho RAM cap cho Pod:"
          free -h
          echo "----------------------------------------------------------"
          echo "📁 Danh sach thu muc ma nguon YAS da clone vao Pod:"
          ls -la
          echo "----------------------------------------------------------"
          echo "✅ KIEM TRA MOI TRUONG RUNNER TREN KUBERNETES THANH CONG 100%!"
